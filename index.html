<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apex Velocity 3D - High Fidelity Grand Prix Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'Rajdhani', sans-serif;
      color: #0f172a;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========================================================= */
    /* 1. 3D SHOWROOM / GARAGE OVERLAY (Bright Frosted Glass UI) */
    /* ========================================================= */
    .garage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 30px;
    }

    .garage-overlay button, .garage-overlay .currency-pill {
      pointer-events: auto;
    }

    .garage-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .garage-title-badge {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #0284c7 100%);
      padding: 9px 26px 9px 16px;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      border-left: 4px solid #ffffff;
      box-shadow: 0 6px 25px rgba(124, 58, 237, 0.5);
      gap: 12px;
    }

    .back-arrow-icon {
      font-size: 16px;
      color: #ffffff;
    }

    .garage-title-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .garage-top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-pill-btn {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 1);
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
    }

    .nav-pill-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(124, 58, 237, 0.4);
    }

    /* Currency Pills (Bright High-Contrast) */
    .currency-pill {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 1);
      border-radius: 20px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    }

    .currency-pill.gold-pill {
      color: #b45309;
      border-color: #fde047;
    }

    .currency-pill.cash-pill {
      color: #0369a1;
      border-color: #bae6fd;
    }

    .plus-btn {
      background: #10b981;
      color: #ffffff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    /* Left Specifications Panel (Bright Frosted Glass) */
    .garage-specs-panel {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 330px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 1);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.22);
    }

    .specs-header-badge {
      background: linear-gradient(90deg, #7c3aed 0%, #0284c7 100%);
      padding: 6px 16px;
      clip-path: polygon(0 0, 95% 0, 100% 100%, 0 100%);
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-top: -12px;
      margin-left: -12px;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }

    .specs-car-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: 4px;
    }

    .specs-car-brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #7c3aed;
      display: block;
    }

    .specs-car-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 1px;
      line-height: 1.2;
    }

    .specs-car-badge {
      background: #7c3aed;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 4px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
    }

    .specs-car-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.4;
      font-weight: 600;
    }

    .specs-bars-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spec-bar-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spec-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #334155;
      letter-spacing: 1.5px;
    }

    .spec-progress-track {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }

    .spec-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #0284c7);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .specs-action-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-owned {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }

    .btn-owned:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6);
    }

    .btn-owned.active-selected {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-buy-coins {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: all 0.2s ease;
    }

    .btn-buy-coins:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
    }

    .purchase-msg {
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
    }

    .msg-error {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    .msg-success {
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
    }

    /* Carousel Nav Chevrons */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 1);
      color: #7c3aed;
      font-size: 34px;
      cursor: pointer;
      padding: 16px 14px;
      border-radius: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.18);
    }

    .carousel-nav-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      transform: translateY(-50%) scale(1.1);
    }

    .carousel-left { left: 390px; }
    .carousel-right { right: 40px; }

    .garage-bottom-right {
      position: absolute;
      right: 40px;
      bottom: 35px;
    }

    .btn-play-race {
      background: linear-gradient(135deg, #10b981, #059669);
      border: 2px solid #6ee7b7;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 16px 50px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
      transition: all 0.2s ease;
    }

    .btn-play-race:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(16, 185, 129, 0.7);
    }

    .play-arrow {
      font-size: 24px;
    }

    /* ========================================================= */
    /* 2. INVENTORY MODAL (Bright Sporty Theme)                  */
    /* ========================================================= */
    .inventory-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .inventory-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .inventory-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
    }

    .inventory-shell {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 1200px;
      height: 90%;
      background: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    }

    .inventory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 16px 26px;
      border-bottom: 1px solid #e2e8f0;
    }

    .inv-back-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .inv-back-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    .inv-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #0f172a;
    }

    .inv-currencies {
      display: flex;
      gap: 12px;
    }

    .inventory-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .inv-sidebar {
      width: 190px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 12px 0;
    }

    .inv-side-btn {
      background: none;
      border: none;
      color: #475569;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 14px 22px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
      border-left: 4px solid transparent;
    }

    .inv-side-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .inv-side-btn.active {
      background: #f5f3ff;
      color: #7c3aed;
      border-left-color: #7c3aed;
    }

    .inv-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 18px;
      background: #f8fafc;
    }

    .inv-filters-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 14px;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .filter-tab {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active, .filter-tab:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    .sort-selector {
      font-size: 12px;
      font-weight: 700;
      color: #475569;
    }

    .inv-cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .inv-car-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    .inv-car-card:hover {
      border-color: #7c3aed;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.2);
    }

    .inv-car-card.selected {
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    .card-top-strip {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-brand-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: #7c3aed;
      display: block;
    }

    .card-car-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .card-price-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #b45309;
    }

    .card-preview-area {
      height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      padding: 6px;
    }

    .car-svg-preview {
      width: 100%;
      height: 100%;
    }

    .card-footer-strip {
      background: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e2e8f0;
    }

    .card-rating-tag {
      background: #7c3aed;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-select-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .card-select-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    /* ========================================================= */
    /* 3. IN-GAME HUD & TELEMETRY (Bright Frosted Theme)         */
    /* ========================================================= */
    .hud-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 25px;
    }

    .hud-container button {
      pointer-events: auto;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
    }

    .hud-left-meta, .hud-right-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hud-panel {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 1);
      border-radius: 12px;
      padding: 7px 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #475569;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .pos-value, .lap-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
    }

    .pos-total {
      font-size: 14px;
      color: #64748b;
      margin-left: 2px;
    }

    .hud-coins-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #b45309;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .coin-spin {
      font-size: 18px;
      display: inline-block;
      animation: coinWobble 2s infinite ease-in-out;
    }

    @keyframes coinWobble {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    /* Racing Master Top Center Digital Instrument Cluster */
    .hud-center-cluster {
      display: flex;
      justify-content: center;
      flex: 1;
      max-width: 440px;
      margin: 0 10px;
    }

    .cluster-shell {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      width: 100%;
    }

    .cluster-gear-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      padding-right: 14px;
    }

    .cluster-sublabel {
      font-size: 9px;
      letter-spacing: 2px;
      color: #94a3b8;
      font-weight: 800;
    }

    .cluster-gear {
      font-family: 'Orbitron', sans-serif;
      font-size: 30px;
      font-weight: 900;
      color: #38bdf8;
      line-height: 1;
    }

    .cluster-speed-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 90px;
    }

    .cluster-speed {
      font-family: 'Orbitron', sans-serif;
      font-size: 44px;
      font-weight: 900;
      line-height: 0.95;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .cluster-unit {
      font-size: 11px;
      letter-spacing: 2px;
      color: #94a3b8;
      font-weight: 800;
      margin-top: 2px;
    }

    .cluster-meters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .cluster-rpm-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .cluster-rpm-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 4px;
      transition: width 0.05s linear;
    }

    .cluster-nitro-track {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .cluster-nitro-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 4px;
      box-shadow: 0 0 10px #38bdf8;
      transition: width 0.08s linear;
    }

    .cluster-nitro-label {
      position: absolute;
      top: -12px;
      right: 0;
      font-size: 8px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .cluster-indicators {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .ind-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #64748b;
      letter-spacing: 1px;
    }

    .ind-pill.active {
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      border: 1px solid #10b981;
    }

    .ind-pill.ready-nos {
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .ind-pill.active-nos {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulseGlow 0.2s infinite alternate;
    }

    @keyframes pulseGlow {
      from { filter: brightness(1.0); }
      to { filter: brightness(1.6); }
    }

    .timer-panel {
      min-width: 150px;
      align-items: flex-start;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .timer-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #0284c7;
    }

    .timer-value.best {
      color: #d97706;
    }

    .quick-controls {
      flex-direction: row;
      gap: 8px;
      padding: 6px 10px;
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 7px 13px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .hud-btn:hover {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
      transform: translateY(-1px);
    }

    /* Popups */
    .coin-pickup-popup {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.9), 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 22;
    }

    .nitro-pickup-popup {
      position: absolute;
      top: 170px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 20px #0284c7, 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 22;
    }

    .pop-animate {
      animation: coinFloatUp 0.8s ease-out forwards;
    }

    @keyframes coinFloatUp {
      0% { opacity: 0; transform: translate(-50%, 15px) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -45px) scale(1.0); }
    }

    /* Clean 3-2-1 Countdown (Hides completely once race begins, no dots blocking car) */
    .countdown-overlay {
      position: absolute;
      top: 36%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      pointer-events: none;
    }

    .countdown-overlay.hidden {
      display: none !important;
    }

    .countdown-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 110px;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow: 0 0 50px currentColor, 0 4px 20px rgba(0,0,0,0.9);
      animation: countScaleIn 0.5s ease-out;
    }

    @keyframes countScaleIn {
      0% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.0); opacity: 1; }
    }

    .count-red { color: #ef4444; }
    .count-amber { color: #f59e0b; }
    .count-yellow { color: #eab308; }
    .count-green { color: #10b981; }

    /* Bottom Bar */
    .hud-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .minimap-wrapper {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      padding: 6px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      width: 172px;
      height: 172px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #minimap-canvas {
      border-radius: 50%;
    }

    /* Desktop Nitro Boost Button */
    .hud-center-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      pointer-events: auto;
    }

    .hud-nitro-btn {
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      border: 2px solid #38bdf8;
      border-radius: 14px;
      color: #ffffff;
      padding: 12px 28px;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
      transition: all 0.15s ease;
    }

    .hud-nitro-btn:hover, .hud-nitro-btn:active {
      background: linear-gradient(135deg, #06b6d4, #38bdf8);
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.95);
    }

    .nitro-btn-icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px #fef08a);
    }

    .nitro-btn-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .nitro-btn-main {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .nitro-btn-sub {
      font-size: 9px;
      font-weight: 700;
      color: #bae6fd;
      letter-spacing: 1.5px;
    }

    /* ========================================================= */
    /* 4. RACING MASTER TRANSLUCENT TOUCH CONTROLS (Image 1 & 2) */
    /* ========================================================= */
    .touch-controls-layer {
      display: flex;
      position: absolute;
      bottom: 22px;
      left: 0;
      width: 100%;
      padding: 0 28px;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 15;
    }

    .touch-left-cluster, .touch-right-cluster {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      pointer-events: auto;
    }

    /* Translucent Steering Double Chevrons 《 》 */
    .touch-btn-steer {
      width: 82px;
      height: 82px;
      border-radius: 26px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 36px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: background 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
      touch-action: none;
    }

    .touch-btn-steer:active {
      background: rgba(56, 189, 248, 0.45);
      border-color: #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
      transform: scale(0.96);
    }

    /* Translucent DRIFT Pedal Button */
    .touch-btn-drift {
      width: 86px;
      height: 72px;
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(245, 158, 11, 0.5);
      color: #fef08a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transition: all 0.1s ease;
      touch-action: none;
    }

    .touch-btn-drift:active {
      background: rgba(245, 158, 11, 0.5);
      border-color: #f59e0b;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.9);
      transform: scale(0.95);
    }

    /* Translucent NITRO Boost Button */
    .touch-btn-nitro {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.75) 0%, rgba(2, 132, 199, 0.55) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2.5px solid #38bdf8;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.75);
      cursor: pointer;
      transition: all 0.1s ease;
      touch-action: none;
    }

    .touch-btn-nitro:active {
      transform: scale(1.08);
      box-shadow: 0 0 45px rgba(56, 189, 248, 1.0);
    }

    .touch-btn-subicon {
      font-size: 20px;
      line-height: 1;
    }

    .touch-btn-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      margin-top: 3px;
    }

    /* Translucent Brake & Gas Pedals */
    .touch-btn-pedal {
      width: 68px;
      height: 88px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: all 0.1s ease;
      touch-action: none;
    }

    .touch-btn-brake {
      border: 2px solid rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }

    .touch-btn-brake:active {
      background: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
      transform: scale(0.95);
    }

    .touch-btn-gas {
      border: 2px solid rgba(34, 197, 94, 0.6);
      color: #86efac;
    }

    .touch-btn-gas:active {
      background: rgba(34, 197, 94, 0.5);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.9);
      transform: scale(0.95);
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 800px) {
      .hud-center-cluster {
        order: 3;
        width: 100%;
        max-width: 100%;
        margin-top: 8px;
      }
      .cluster-speed {
        font-size: 36px;
      }
      .touch-btn-steer {
        width: 72px;
        height: 72px;
        font-size: 30px;
      }
      .touch-btn-drift, .touch-btn-pedal {
        width: 62px;
        height: 76px;
      }
      .touch-btn-nitro {
        width: 74px;
        height: 74px;
      }
      .minimap-wrapper {
        width: 130px;
        height: 130px;
      }
      #minimap-canvas {
        width: 118px;
        height: 118px;
      }
      .hud-center-actions {
        display: none;
      }
    }

    /* Modals (Pause & Finish) */
    #menu-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    .menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .menu-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
    }

    .modal-content {
      position: relative;
      z-index: 2;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 520px;
      width: 90%;
      padding: 32px;
      gap: 20px;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #0f172a;
    }

    .modal-btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-modal {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #0284c7;
      border: none;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }

    .btn-accent {
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      border: none;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-accent:hover {
      background: #6d28d9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-primary-large {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      padding: 14px 38px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
      transition: all 0.2s ease;
    }

    .btn-primary-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.7);
    }

    .results-modal {
      gap: 25px;
    }

    .finish-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #d97706;
    }

    .finish-position {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #0f172a;
    }

    .results-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-lbl {
      font-size: 11px;
      letter-spacing: 2px;
      color: #64748b;
      font-weight: 800;
    }

    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
    }

    .stat-gold { color: #d97706; }
    .stat-cyan { color: #0284c7; }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="garage-container"></div>
  <div id="hud-container"></div>
  <div id="menu-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
