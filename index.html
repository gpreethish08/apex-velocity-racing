<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Apex Velocity 3D - High Fidelity Grand Prix Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0f;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========================================================= */
    /* 1. 3D SHOWROOM / GARAGE OVERLAY (Matching User Image 2)   */
    /* ========================================================= */
    .garage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 30px;
    }

    .garage-overlay button, .garage-overlay .currency-pill {
      pointer-events: auto;
    }

    /* Garage Top Bar */
    .garage-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .garage-title-badge {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 45%, #0284c7 46%, #0369a1 100%);
      padding: 8px 24px 8px 14px;
      clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
      border-left: 4px solid #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      gap: 10px;
    }

    .back-arrow-icon {
      font-size: 16px;
      color: #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .garage-title-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .garage-top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-pill-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f1f5f9;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .nav-pill-btn:hover {
      background: rgba(2, 132, 199, 0.4);
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    /* Currency Pills (Coins & Cash matching Image 1 & 2) */
    .currency-pill {
      background: rgba(10, 15, 29, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .currency-pill.gold-pill {
      border-color: rgba(234, 179, 8, 0.5);
      color: #fef08a;
    }

    .currency-pill.cash-pill {
      border-color: rgba(56, 189, 248, 0.4);
      color: #bae6fd;
    }

    .plus-btn {
      background: #22c55e;
      color: #ffffff;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      margin-left: 4px;
      cursor: pointer;
    }

    /* Left Specifications Panel (Matching Image 2) */
    .garage-specs-panel {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 320px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .specs-header-badge {
      background: linear-gradient(90deg, #0284c7 0%, #06b6d4 100%);
      padding: 6px 16px;
      clip-path: polygon(0 0, 95% 0, 100% 100%, 0 100%);
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      margin-top: -10px;
      margin-left: -10px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
    }

    .stripes {
      color: #f97316;
      font-style: italic;
    }

    .specs-car-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .specs-car-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #f8fafc;
      letter-spacing: 2px;
    }

    .specs-car-badge {
      background: #facc15;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.5);
    }

    .specs-car-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .specs-bars-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spec-bar-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spec-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 1.5px;
    }

    .spec-progress-track {
      width: 100%;
      height: 10px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .spec-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #22d3ee);
      box-shadow: 0 0 10px #22d3ee;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .specs-action-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-owned {
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: 1px solid #38bdf8;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
      transition: all 0.2s ease;
    }

    .btn-owned:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.8);
    }

    .btn-owned.active-selected {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #34d399;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
    }

    .btn-buy-coins {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      border: 1px solid #fde047;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.6);
      transition: all 0.2s ease;
    }

    .btn-buy-coins:hover {
      background: linear-gradient(135deg, #facc15, #eab308);
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(234, 179, 8, 0.8);
    }

    .purchase-msg {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      padding: 4px;
      border-radius: 4px;
    }

    .msg-error {
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
    }

    .msg-success {
      color: #4ade80;
      background: rgba(34, 197, 94, 0.15);
    }

    /* Carousel Nav Chevrons (Matching Image 2) */
    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.4);
      border: none;
      color: #22d3ee;
      font-size: 38px;
      cursor: pointer;
      padding: 20px 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-shadow: 0 0 15px #22d3ee;
    }

    .carousel-nav-btn:hover {
      background: rgba(6, 182, 212, 0.2);
      transform: translateY(-50%) scale(1.15);
      color: #67e8f9;
    }

    .carousel-left {
      left: 380px;
    }

    .carousel-right {
      right: 40px;
    }

    /* Bottom Right PLAY Button (Matching Image 2) */
    .garage-bottom-right {
      position: absolute;
      right: 40px;
      bottom: 35px;
    }

    .btn-play-race {
      background: linear-gradient(135deg, #16a34a, #15803d);
      border: 2px solid #86efac;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 4px;
      padding: 18px 55px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.6);
      transition: all 0.2s ease;
    }

    .btn-play-race:hover {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(34, 197, 94, 0.9);
    }

    .play-arrow {
      color: #ffffff;
      font-size: 24px;
      filter: drop-shadow(0 0 8px #86efac);
    }

    /* ========================================================= */
    /* 2. INVENTORY / CAR CATALOG MODAL (Matching User Image 1)  */
    /* ========================================================= */
    .inventory-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .inventory-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .inventory-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.94);
      backdrop-filter: blur(16px);
    }

    .inventory-shell {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 1250px;
      height: 90%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .inventory-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      padding: 14px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .inv-back-btn {
      background: none;
      border: none;
      color: #facc15;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .inv-back-btn:hover {
      color: #ffffff;
    }

    .inv-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f8fafc;
    }

    .inv-currencies {
      display: flex;
      gap: 12px;
    }

    .inventory-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar (Matching Image 1) */
    .inv-sidebar {
      width: 180px;
      background: #0f172a;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 10px 0;
    }

    .inv-side-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 14px 20px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
      border-left: 3px solid transparent;
    }

    .inv-side-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #ffffff;
    }

    .inv-side-btn.active {
      background: rgba(225, 29, 72, 0.15);
      color: #ffffff;
      border-left-color: #e11d48;
    }

    /* Main Grid Area */
    .inv-content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px;
      gap: 16px;
    }

    .inv-filters-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .filter-tab {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-tab.active, .filter-tab:hover {
      background: #e11d48;
      color: #ffffff;
      border-color: #f43f5e;
    }

    .sort-selector {
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
    }

    /* 8 Cars Grid (Matching Image 1) */
    .inv-cars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .inv-car-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .inv-car-card:hover {
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2);
    }

    .inv-car-card.selected {
      border-color: #10b981;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    .card-top-strip {
      background: linear-gradient(90deg, #9f1239 0%, #1e293b 100%);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-car-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .card-price-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #facc15;
    }

    .card-preview-area {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      padding: 5px;
    }

    .car-svg-preview {
      width: 100%;
      height: 100%;
    }

    .card-footer-strip {
      background: #0f172a;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-rating-tag {
      background: #facc15;
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .card-select-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .card-select-btn:hover {
      background: #38bdf8;
      color: #000000;
    }

    /* ========================================================= */
    /* 3. IN-GAME HUD & TELEMETRY                                */
    /* ========================================================= */
    .hud-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-container button {
      pointer-events: auto;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 8px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hud-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .pos-value, .lap-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #f8fafc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .pos-total {
      font-size: 14px;
      color: #64748b;
      margin-left: 3px;
    }

    .hud-coins-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .coin-spin {
      font-size: 18px;
      display: inline-block;
      animation: coinWobble 2s infinite ease-in-out;
    }

    @keyframes coinWobble {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(180deg); }
    }

    .timer-panel {
      min-width: 150px;
      align-items: flex-start;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .timer-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }

    .timer-value.best {
      color: #facc15;
    }

    .quick-controls {
      flex-direction: row;
      gap: 8px;
      padding: 6px 10px;
    }

    .hud-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .hud-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Coin Pickup Floating Popup */
    .coin-pickup-popup {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 0 15px #facc15;
      pointer-events: none;
      z-index: 22;
    }

    .pop-animate {
      animation: coinFloatUp 0.8s ease-out forwards;
    }

    @keyframes coinFloatUp {
      0% { opacity: 0; transform: translate(-50%, 15px) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -45px) scale(1.0); }
    }

    /* Drift Banner Overlay */
    .drift-banner {
      position: absolute;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(239, 68, 68, 0.9));
      padding: 10px 30px;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
      text-align: center;
      border: 2px solid #fef08a;
      animation: driftPulse 0.4s infinite alternate;
    }

    @keyframes driftPulse {
      0% { transform: translateX(-50%) scale(1.0); }
      100% { transform: translateX(-50%) scale(1.04); }
    }

    .drift-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ffffff;
    }

    .drift-points {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .drift-multiplier {
      font-size: 14px;
      font-weight: 700;
      color: #fef08a;
    }

    /* Starting Countdown Lights */
    .countdown-overlay {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 25;
      pointer-events: none;
    }

    .countdown-box {
      background: rgba(10, 15, 29, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .countdown-lights {
      display: flex;
      gap: 16px;
    }

    .start-light {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #260a0a;
      border: 2px solid #450a0a;
      transition: all 0.15s ease;
    }

    .start-light.light-red {
      background: #ef4444;
      border-color: #fca5a5;
      box-shadow: 0 0 20px #ef4444, 0 0 40px #ef4444;
    }

    .start-light.light-green {
      background: #22c55e;
      border-color: #86efac;
      box-shadow: 0 0 25px #22c55e, 0 0 50px #22c55e;
    }

    .countdown-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #f8fafc;
      letter-spacing: 4px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    /* Bottom Bar */
    .hud-bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .minimap-wrapper {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      padding: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 196px;
      height: 196px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #minimap-canvas {
      border-radius: 50%;
    }

    .speedo-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .nitro-gauge-wrap {
      width: 180px;
      height: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .nitro-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      box-shadow: 0 0 12px #38bdf8;
      transition: width 0.08s linear;
    }

    .nitro-pulsing {
      background: linear-gradient(90deg, #38bdf8, #f0abfc) !important;
      animation: nitroFlash 0.15s infinite alternate;
    }

    @keyframes nitroFlash {
      0% { filter: brightness(1.0); }
      100% { filter: brightness(1.6); }
    }

    .nitro-label {
      position: absolute;
      top: -16px;
      right: 0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
    }

    .speedo-dial {
      position: relative;
      width: 190px;
      height: 190px;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.85) 45%, rgba(30, 41, 59, 0.6) 100%);
      backdrop-filter: blur(12px);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .tacho-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(135deg);
    }

    .tacho-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 12;
      stroke-dasharray: 386;
      stroke-dashoffset: 0;
      stroke-linecap: round;
    }

    .tacho-fg {
      fill: none;
      stroke: #06b6d4;
      stroke-width: 12;
      stroke-dasharray: 515;
      stroke-dashoffset: 386;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.05s linear, stroke 0.2s ease;
      filter: drop-shadow(0 0 8px currentColor);
    }

    .speedo-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .gear-indicator {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
      margin-bottom: -4px;
    }

    .speed-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
    }

    .speed-unit {
      font-size: 13px;
      letter-spacing: 2.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Touch Controls */
    .touch-controls-layer {
      display: none;
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      padding: 0 25px;
      justify-content: space-between;
      pointer-events: none;
      z-index: 15;
    }

    @media (max-width: 900px), (pointer: coarse) {
      .touch-controls-layer {
        display: flex;
      }
    }

    .touch-left-cluster, .touch-right-cluster {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      cursor: pointer;
    }

    .touch-btn:active {
      background: rgba(56, 189, 248, 0.5);
      transform: scale(0.92);
    }

    .touch-btn-gas { background: rgba(34, 197, 94, 0.5) !important; border-color: #4ade80 !important; }
    .touch-btn-brake { background: rgba(239, 68, 68, 0.5) !important; border-color: #f87171 !important; }
    .touch-btn-nitro { background: rgba(6, 182, 212, 0.6) !important; border-color: #22d3ee !important; }

    /* Modals (Pause & Finish) */
    #menu-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
    }

    .menu-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .menu-screen.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .menu-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.75) 0%, rgba(3, 7, 18, 0.95) 100%);
    }

    .menu-backdrop.blur {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .modal-content {
      position: relative;
      z-index: 2;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 520px;
      width: 90%;
      padding: 30px;
      gap: 20px;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #f8fafc;
    }

    .modal-btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-modal {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #0284c7;
      border: none;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-primary:hover {
      background: #0369a1;
      transform: translateY(-2px);
    }

    .btn-accent {
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: none;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
    }

    .btn-accent:hover {
      background: #ea580c;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.9);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .btn-primary-large {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      color: #ffffff;
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      padding: 14px 38px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.6);
      transition: all 0.2s ease;
    }

    .btn-primary-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(239, 68, 68, 0.8);
    }

    .results-modal {
      gap: 25px;
    }

    .finish-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #facc15;
    }

    .finish-position {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(250, 204, 21, 0.7);
    }

    .results-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .stat-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-lbl {
      font-size: 11px;
      letter-spacing: 2px;
      color: #94a3b8;
      font-weight: 700;
    }

    .stat-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: #f8fafc;
    }

    .stat-gold { color: #facc15; text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
    .stat-cyan { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="garage-container"></div>
  <div id="hud-container"></div>
  <div id="menu-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
